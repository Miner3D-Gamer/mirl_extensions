[package]
name = "mirl_extensions"
version = "0.0.0-alpha"
edition = "2024"
repository = "https://github.com/Miner3D-Gamer/mirl_extensions"
license.workspace = true
authors.workspace = true
rust-version.workspace = true
maintenance.workspace = true

[features]
default = ["std"]
std = [
    "mirl_extensions_conversion/std",
    "indexmap?/std",
    "mirl_buffer/std",
    "mirl_extensions_core/std",
    "mirl_extensions_math/std",
    "mirl_geometry_core?/std",
    "mirl_graphics?/std",
    "num-bigfloat?/std",
    "num-bigint?/std",
    "num-traits?/std",
]
# Core
all = [
    "mirl_values",
    "indexmap",
    "dashmap",
    "masstree",
    "tokio",
    "ascii",
    "mirl_graphics",
    "mirl_input",
    "mirl_collections",
    "mirl_buffer/all",
    "mirl_collections?/all",
    "mirl_extensions_core/all",
    "mirl_extensions_math/all",
    "mirl_graphics?/all",
    "mirl_input?/all",
    "mirl_values_core?/all",
]
### Compatibility with ffi
c_compatible = [
    "mirl_buffer/c_compatible",
    "mirl_collections?/c_compatible",
    "mirl_extensions_core/c_compatible",
    "mirl_geometry_core?/c_compatible",
    "mirl_graphics?/c_compatible",
    "mirl_input?/c_compatible",
    "mirl_values_core?/c_compatible",
]
# Supported crates
### Mirl
mirl_values = [
    "dep:mirl_values_core",
    "bigint",
    "bigfloat",
    "mirl_extensions_conversion/mirl_values",
]
mirl_collections = ["dep:mirl_collections", "mirl_graphics?/mirl_collections"]
mirl_graphics = [
    "dep:mirl_graphics",
    "mirl_extensions_conversion/mirl_graphics",
]
mirl_input = ["dep:mirl_input"]
mirl_geometry = ["dep:mirl_geometry_core"]
### Support for hashmap libs
indexmap = [
    "dep:indexmap",
    "std",
    "mirl_extensions_core/indexmap",
    "mirl_extensions_conversion/indexmap",
]
dashmap = [
    "dep:dashmap",
    "std",
    "mirl_extensions_core/dashmap",
    "mirl_extensions_conversion/dashmap",
]
masstree = [
    "dep:masstree",
    "std",
    "mirl_extensions_core/masstree",
    "mirl_extensions_conversion/masstree",
]
# Async
tokio = ["dep:tokio", "mirl_extensions_conversion/tokio"]
glfw = ["mirl_extensions_conversion/glfw"]
bigfloat = [
    "dep:num-bigfloat",
    "mirl_extensions_conversion/bigfloat",
    "mirl_extensions_math/bigfloat",
    "mirl_extensions_core/bigfloat",
]
bigint = [
    "dep:num-bigint",
    "dep:num-traits",
    "mirl_extensions_conversion/bigint",
    "mirl_extensions_math/bigint",
    "mirl_extensions_core/bigint",
]
ascii = ["mirl_extensions_conversion/ascii"]
_checking = [
    "indexmap",
    "dashmap",
    "masstree",
    "tokio",
    "mirl_values",
    "ascii",
    "mirl_graphics",
    "mirl_input",
    "mirl_collections",
    "mirl_geometry",
]
f128 = ["mirl_extensions_math/f128"]
f16 = ["mirl_extensions_math/f16"]
fixed = ["mirl_extensions_math/fixed", "mirl_extensions_core/fixed"]
[dependencies]
### Like a HashMap but concurrent
dashmap = { version = "6.1", optional = true, default-features = false }
# Crate support
### Like a HashMap but it remembers in what order elements were inserted
indexmap = { version = "2.14", optional = true, default-features = false, features = [
    "std",
] }
### A concurrent indexmap
masstree = { version = "0.9", optional = true, default-features = false }
mirl_buffer = { version = "0.0.0-alpha" }
mirl_collections = { version = "0.0.0-alpha", optional = true }
mirl_extensions_conversion = { version = "0.0.0-alpha" }
# mirl_core = { version = "0.0.0-alpha" }
mirl_extensions_core = { version = "0.0.0-alpha" }
mirl_extensions_math = { version = "0.0.0-alpha" }
mirl_geometry_core = { version = "0.0.0-alpha", optional = true }
mirl_graphics = { version = "0.0.0-alpha", optional = true }
mirl_input = { version = "0.0.0-alpha", optional = true }
mirl_values_core = { version = "0.0.0-alpha", optional = true }
num-bigfloat = { version = "1.7", optional = true, default-features = false, features = [
    "std",
    "num-traits",
] }
### Number crates
num-bigint = { version = "0.5", optional = true }
num-traits = { version = "0.2.19", optional = true }
### Concurrency
tokio = { version = "1.53", optional = true, features = ["sync"] }

[build-dependencies]
mirl_build_tools = { version = "0.0.0-alpha" }

[lints]
workspace = true
